<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Email confirmed · Sparrow Collect</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #F7FAF9; color: #0F172A;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; -webkit-font-smoothing: antialiased;
    }
    .card {
      background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 20px;
      max-width: 420px; width: 100%; padding: 40px 32px; text-align: center;
      box-shadow: 0 8px 30px rgba(44,120,115,0.08);
    }
    .badge {
      width: 72px; height: 72px; border-radius: 50%;
      background: #E6F7F5; display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
    }
    .badge svg { width: 38px; height: 38px; }
    .brand { font-size: 14px; font-weight: 700; color: #44A9A1; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 8px; }
    h1 { font-size: 26px; font-weight: 800; margin-bottom: 12px; }
    p { font-size: 16px; line-height: 24px; color: #475569; margin-bottom: 28px; }
    .btn {
      display: inline-block; width: 100%; padding: 16px 24px;
      background: #44A9A1; color: #FFFFFF; text-decoration: none;
      font-size: 16px; font-weight: 700; border-radius: 14px;
      box-shadow: 0 4px 14px rgba(44,120,115,0.3);
    }
    .hint { margin-top: 20px; font-size: 13px; color: #94A3B8; line-height: 19px; }
    .foot { margin-top: 28px; font-size: 12px; color: #CBD5E1; }
    .foot a { color: #94A3B8; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 6L9 17l-5-5" stroke="#44A9A1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="brand">Sparrow&nbsp;Collect</div>
    <!-- Copy is set by the script below from the link's `type`. This ONE page
         serves both Supabase emails — signup confirmation and password
         recovery — and it used to say "You're verified" for both, so anyone
         resetting a password was told their email was verified instead.
         Defaults to the signup wording; recovery overrides it. -->
    <h1 id="headline">You&rsquo;re verified</h1>
    <p id="blurb">Opening the Sparrow Collect app to finish&hellip; If it doesn&rsquo;t open automatically, tap below.</p>
    <a class="btn" id="openApp" href="sparrow://">Open Sparrow Collect</a>
    <p class="hint" id="hint">If the app doesn&rsquo;t open, switch back to it manually to continue.</p>
    <div class="foot">
      <a href="https://sparrowcollect.com">sparrowcollect.com</a> &middot; <a href="mailto:support@sparrowcollect.com">support@sparrowcollect.com</a>
    </div>
  </div>
  <script>
    // Forward any auth tokens Supabase appended (#access_token=...) to the app,
    // so a build that handles the deep link can pick up the session directly.
    (function () {
      try {
        var hash = window.location.hash || '';
        var link = document.getElementById('openApp');
        if (hash && hash.length > 1) link.href = 'sparrow://' + hash;

        // Which email did this come from? Supabase puts `type=recovery` in the
        // fragment for a password reset and `type=signup` for a confirmation.
        // Also accept it from the query string, because the PKCE flow puts it
        // there instead.
        var isRecovery =
          /(^|[#&?])type=recovery(&|$)/.test(hash) ||
          /(^|[&?])type=recovery(&|$)/.test(window.location.search || '');

        if (isRecovery) {
          document.getElementById('headline').textContent = 'Reset your password';
          document.getElementById('blurb').textContent =
            'Opening Sparrow Collect so you can choose a new password… If it doesn’t open automatically, tap below.';
          document.getElementById('openApp').textContent = 'Set a new password';
          document.getElementById('hint').textContent =
            'This link works once and expires shortly. If it has expired, request a new one from Forgot password.';
          document.title = 'Reset your password · Sparrow Collect';
        }
        // Best-effort auto-open on mobile (user gesture not always required for same-origin scheme).
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          setTimeout(function () { window.location.href = link.href; }, 600);
        }
      } catch (e) {}
    })();
  </script>
    <script src="/referral.js" defer></script>
</body>
</html>
