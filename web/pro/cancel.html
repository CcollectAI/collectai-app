<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout cancelled — Sparrow Collect</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Roboto', sans-serif;
    color: #0F172A;
    background: linear-gradient(180deg, #F0FBFB 0%, #FFFFFF 60%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 460px; width: 100%;
    background: #FFFFFF; border-radius: 20px;
    padding: 40px 32px; text-align: center;
    box-shadow: 0 6px 20px rgba(0,0,0,0.05);
    border: 1px solid #E2E8F0;
  }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
  p { font-size: 15px; color: #475569; margin-bottom: 24px; line-height: 1.5; }
  .cta {
    display: inline-block; padding: 12px 24px;
    background: linear-gradient(90deg, #44A9A1, #81D8D0);
    color: #FFFFFF; text-decoration: none; font-weight: 700;
    border-radius: 10px;
  }
  .secondary {
    display: inline-block; padding: 12px 24px; margin-left: 8px;
    color: #64748B; text-decoration: none; font-weight: 500;
    border-radius: 10px;
  }
</style>
</head>
<body>
<div class="card">
  <h1>Checkout cancelled</h1>
  <p>No charge was made. You can try again anytime.</p>
  <a href="/pro" class="cta">Back to pricing</a>
  <a href="/" class="secondary">Home</a>
</div>
    <script src="/referral.js" defer></script>
</body>
</html>
