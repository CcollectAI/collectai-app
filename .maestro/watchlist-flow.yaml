appId: com.collectai.app
---
- launchApp
# Navigate to Wishlist tab
- tapOn:
    id: "tab-wishlist"
- assertVisible:
    text: "Wishlist"
    timeout: 5000
# Tap add button if available
- runFlow:
    when:
      visible:
        id: "add-watchlist-button"
    commands:
      - tapOn:
          id: "add-watchlist-button"
      - assertVisible: "Add to Wishlist"
