appId: com.collectai.app
---
- launchApp
# Navigate to Marketplace tab
- tapOn:
    id: "tab-marketplace"
- assertVisible:
    text: "Search"
    timeout: 5000
# Tap search input
- tapOn:
    accessibilityLabel: "Search items and collections"
# Type a search query
- inputText: "Pokemon"
- pressKey: Enter
# Wait for results to appear
- assertVisible:
    text: "Pokemon"
    timeout: 10000
# Tap the first result
- tapOn:
    index: 0
    id: "marketplace-result"
# Verify detail/quick-view loads
- assertVisible:
    text: "Pokemon"
    timeout: 5000
