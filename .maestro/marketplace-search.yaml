appId: com.collectai.app
---
- launchApp
# Navigate to Marketplace tab
- tapOn:
    id: "tab-marketplace"
- assertVisible:
    text: "Search"
    timeout: 5000
# Type a search query
- tapOn:
    id: "marketplace-search-input"
- inputText: "Charizard"
- pressKey: Enter
# Wait for results
- assertVisible:
    text: "results"
    timeout: 10000
