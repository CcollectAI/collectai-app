name: sentry-release

# Tag a Sentry release when production code lands on main / feature
# branches. The actual source-map upload runs at build time on EAS via
# eas-build-post-install.sh — this workflow is the bookkeeping side:
# tells Sentry "commit X = release Y" so its UI can show which release
# introduced each issue.
#
# Triggers:
#   - push to main, feature/all-enhancements (the working branches)
#   - dispatched manually for ad-hoc releases
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   - SENTRY_AUTH_TOKEN  (sentry.io → Auth Tokens, scopes: project:releases)
#   - SENTRY_ORG         (e.g. sparrow-collect)
#   - SENTRY_PROJECT     (e.g. sparrow-collect)
#
# If those secrets are unset, the job soft-skips with a warning so PRs
# from forks / first-time clones don't get a red X. The same secrets
# are pushed to EAS via scripts/setup_sentry_sourcemap_upload.sh.
#
# Why a separate workflow (not part of ci-min.yml):
#   ci-min runs on every PR and shouldn't talk to Sentry. This one
#   runs only on push to a working branch — the boundary where "the
#   code that ran in CI" turns into "the code that ships."

on:
  push:
    branches:
      - main
      - feature/all-enhancements
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Override release version (default = app.json expo.version + git SHA)'
        required: false
        type: string

jobs:
  tag-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so Sentry can map commits to releases

      - name: Check Sentry secrets are configured
        id: check_secrets
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ] || [ -z "${SENTRY_ORG:-}" ] || [ -z "${SENTRY_PROJECT:-}" ]; then
            echo "Sentry secrets not configured — skipping release tagging."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Compute release version
        if: steps.check_secrets.outputs.configured == 'true'
        id: version
        run: |
          if [ -n "${{ inputs.release_version }}" ]; then
            VERSION="${{ inputs.release_version }}"
          else
            APP_VERSION=$(jq -r '.expo.version' app.json)
            SHA=$(git rev-parse --short HEAD)
            VERSION="sparrow-collect@${APP_VERSION}+${SHA}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tagging Sentry release: $VERSION"

      - name: Create Sentry release + associate commits
        if: steps.check_secrets.outputs.configured == 'true'
        uses: getsentry/action-release@v1
        with:
          environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
          version: ${{ steps.version.outputs.version }}
          set_commits: auto
          # Source maps are uploaded at EAS build time, not here — this
          # action only creates the release record + links commits.
          sourcemaps: ''
          finalize: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
