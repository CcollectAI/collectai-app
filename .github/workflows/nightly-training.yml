name: Nightly Training Export + Trigger
on:
  schedule: [{ cron: "07 1 * * *" }]
  workflow_dispatch: {}
jobs:
  export-train:
    runs-on: ubuntu-latest
    env:
      HAS_SECRETS: ${{ secrets.SUPABASE_URL != '' }}
    steps:
      - name: Check secrets
        if: env.HAS_SECRETS != 'true'
        run: |
          echo "::warning::Skipping — required secrets not configured (SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, S3_DATA_BUCKET, AWS credentials)"
          exit 0
      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'
      - uses: actions/setup-python@v5
        if: env.HAS_SECRETS == 'true'
        with: { python-version: '3.12' }
      - name: Install deps
        if: env.HAS_SECRETS == 'true'
        run: pip install requests
      - name: AWS CLI
        if: env.HAS_SECRETS == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Run exporter
        if: env.HAS_SECRETS == 'true'
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          S3_DATA_BUCKET:            ${{ secrets.S3_DATA_BUCKET }}   # e.g., s3://collectai-datasets
          AWS_REGION:                ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID:         ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY:     ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TRAIN_LAMBDA_URL:          ${{ secrets.TRAIN_LAMBDA_URL }}  # optional
          MODEL_NAME:                price
        run: python scripts/export_training_and_trigger.py
