# ⛔ NOT WIRED — schedule disabled 2026-09-27. It exported and trained nothing.
#
# Every run logged `No dataset rows; exiting`: `S3_DATA_BUCKET` and
# `TRAIN_LAMBDA_URL` are empty, so the export has nowhere to go and the
# trainer is never called — success every night (run 36300486539). Models are
# trained on EC2 (valuation / retrain workers). Re-enable once both are set.
# See docs/INGEST.md.

name: Nightly Training Export + Trigger
on:
  # schedule: [{ cron: "07 1 * * *" }]   # disabled 2026-09-27 — see the note at the top
  workflow_dispatch: {}
jobs:
  export-train:
    runs-on: ubuntu-latest
    env:
      HAS_SECRETS: ${{ secrets.SUPABASE_URL != '' }}
    steps:
      - name: Check secrets
        if: env.HAS_SECRETS != 'true'
        run: |
          # exit 1, not 0. On a SCHEDULED trigger secrets are always
          # available, so a missing one is a misconfiguration — and every
          # real step below is gated on HAS_SECRETS, so exiting 0 reported a
          # job that did nothing as success. That is exactly how
          # nightly-eval.yml ran zero times while showing 8 green checkmarks.
          echo "::error::Required secrets not configured (SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, S3_DATA_BUCKET, AWS credentials) — this job did NOT run"
          exit 1
      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'
      - uses: actions/setup-python@v5
        if: env.HAS_SECRETS == 'true'
        with: { python-version: '3.12' }
      - name: Install deps
        if: env.HAS_SECRETS == 'true'
        run: pip install requests
      - name: AWS CLI
        if: env.HAS_SECRETS == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Run exporter
        if: env.HAS_SECRETS == 'true'
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          S3_DATA_BUCKET:            ${{ secrets.S3_DATA_BUCKET }}   # e.g., s3://collectai-datasets
          AWS_REGION:                ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID:         ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY:     ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TRAIN_LAMBDA_URL:          ${{ secrets.TRAIN_LAMBDA_URL }}  # optional
          MODEL_NAME:                price
        run: python scripts/export_training_and_trigger.py
