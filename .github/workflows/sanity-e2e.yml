name: Sanity E2E (Supabase)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch: {}

concurrency:
  group: sanity-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_SECRETS: ${{ secrets.SUPA_REF != '' }}

    steps:
      - name: Check secrets
        if: env.HAS_SECRETS != 'true'
        run: |
          echo "::warning::Skipping — SUPA_REF secret not configured"
          exit 0
      - name: Checkout
        if: env.HAS_SECRETS == 'true'
        uses: actions/checkout@v4

      - name: Prepare scripts dir (if needed)
        if: env.HAS_SECRETS == 'true'
        run: mkdir -p logs

      - name: Create supa_test.env from secrets
        if: env.HAS_SECRETS == 'true'
        run: |
          cat > supa_test.env <<ENV
          SUPA_REF=${{ secrets.SUPA_REF }}
          ANON_KEY=${{ secrets.ANON_KEY }}
          SERVICE_ROLE_KEY=${{ secrets.SERVICE_ROLE_KEY }}
          TEST_EMAIL=${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD=${{ secrets.TEST_PASSWORD }}
          ENV
          nl -ba supa_test.env | sed 's/.*/[masked]/' >/dev/null # noop; ensure file exists

      - name: Add auth doctor (hard fix) script
        if: env.HAS_SECRETS == 'true'
        run: |
          cat > auth_hard_fix_and_run.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ -f ./supa_test.env ]]; then set -a; . ./supa_test.env; set +a; else echo "missing env"; exit 1; fi
          : "${SUPA_REF:?}"; : "${ANON_KEY:?}"; : "${SERVICE_ROLE_KEY:?}"; : "${TEST_EMAIL:?}"; : "${TEST_PASSWORD:?}"
          AUTH_URL="https://${SUPA_REF}.supabase.co/auth/v1"
          ADMIN_HDR=(-H "apikey: ${SERVICE_ROLE_KEY}" -H "Authorization: Bearer ${SERVICE_ROLE_KEY}" -H "Content-Type: application/json")
          # NOT ?email= — GoTrue has no email filter on the admin list
          # endpoint and returns HTTP 500 "Database error finding users" when
          # given one. Measured 2026-08-30:
          #   GET /admin/users?email=x    -> 500
          #   GET /admin/users?per_page=8 -> 200
          # That 500 is why every run died at "cannot resolve user id" (a 500
          # body carries no id) and why create then 422'd on a user the delete
          # had never removed. It also produced 32 /admin/users 5xx in one day,
          # which became the bulk of the watchdog's "API returning 5xx".
          #
          # Page through and match client-side, which is the supported API.
          # The python is a ONE-LINER on purpose: this block is indented inside
          # the YAML, a heredoc would carry that indentation into the script,
          # and python raises IndentationError on a uniformly indented file
          # where bash would not care.
          match_id(){ TEST_EMAIL="$TEST_EMAIL" python3 -c 'import json,sys,os; d=json.load(sys.stdin); e=os.environ["TEST_EMAIL"].strip().lower(); print(next((u["id"] for u in d.get("users",[]) if (u.get("email") or "").strip().lower()==e), ""))' 2>/dev/null; }
          get_user_id(){
            local page=1 body id
            while [ "$page" -le 25 ]; do
              body="$(curl -sS "${AUTH_URL}/admin/users?page=${page}&per_page=50" "${ADMIN_HDR[@]}")" || return 0
              id="$(printf '%s' "$body" | match_id)"
              if [ -n "$id" ]; then printf '%s' "$id"; return 0; fi
              # Stop at the first empty page rather than assuming one page is
              # the whole directory — a 51st user must not make this silently
              # stop finding people.
              printf '%s' "$body" | grep -q '"users":\s*\[\s*\]' && break
              page=$((page+1))
            done
            printf ''
          }

          # Assert on a status code and SAY what it was. `| grep -q` under
          # `set -e` fails with no output at all, so a run dies on a bare
          # "exit 1" and the next person theorises instead of reading. Same
          # rule the watchdog applies to workers: a failing step must say WHY.
          expect_code(){ # expect_code <label> <regex> <code>
            printf '   %s -> HTTP %s\n' "$1" "$3"
            [[ "$3" =~ $2 ]] || { echo "   ✗ $1 expected $2, got $3"; return 1; }
          }

          echo "→ Admin check"
          ADMIN_CODE=$(curl -sS -o /dev/null -w "%{http_code}" "${AUTH_URL}/admin/users?per_page=1" "${ADMIN_HDR[@]}")
          expect_code "admin list" '^200$' "$ADMIN_CODE"

          USER_ID="$(get_user_id || true)"
          if [[ -n "${USER_ID:-}" ]]; then
            echo "→ Hard delete ${USER_ID}"
            # 2xx, not exactly 200. GoTrue answers DELETE with 200 in some
            # versions and 204 in others, and requiring one of them is a
            # version pin nobody declared. The code is printed either way.
            DEL_CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X DELETE "${AUTH_URL}/admin/users/${USER_ID}?should_soft_delete=false" "${ADMIN_HDR[@]}")
            expect_code "hard delete" '^2[0-9][0-9]$' "$DEL_CODE"
            for i in $(seq 1 30); do sleep 1; USER_ID="$(get_user_id || true)"; [[ -z "${USER_ID:-}" ]] && break; done
          fi

          echo "→ Create (or fallback patch)"
          CREATE_JSON=$(printf '{"email":"%s","password":"%s","email_confirm":true}' "$TEST_EMAIL" "$TEST_PASSWORD")
          CREATE_RESP=$(curl -sS -w '\n%{http_code}\n' -X POST "${AUTH_URL}/admin/users" "${ADMIN_HDR[@]}" --data-raw "$CREATE_JSON")
          CR_CODE="${CREATE_RESP##*$'\n'}"; CR_BODY="${CREATE_RESP%$'\n'"$CR_CODE"}"
          printf '   create -> HTTP %s\n' "$CR_CODE"
          if [[ "$CR_CODE" =~ ^2 ]]; then
            USER_ID=$(printf '%s' "$CR_BODY" | sed -n 's/.*"id":"\([0-9a-fA-F-]\{36\}\)".*/\1/p' | head -n1)
          else
            USER_ID="$(get_user_id || true)"
          fi
          [[ -n "${USER_ID:-}" ]] || { echo "   ✗ cannot resolve user id (create=$CR_CODE body=${CR_BODY:0:200})"; exit 1; }

          echo "→ Ensure password"
          PATCH_JSON=$(printf '{"password":"%s","email_confirm":true}' "$TEST_PASSWORD")
          PATCH_CODE=$(curl -sS -o /dev/null -w "%{http_code}\n" -X PATCH "${AUTH_URL}/admin/users/${USER_ID}" "${ADMIN_HDR[@]}" --data-raw "$PATCH_JSON")
          if [[ "$PATCH_CODE" = "405" ]]; then
            PUT_CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X PUT "${AUTH_URL}/admin/users/${USER_ID}" "${ADMIN_HDR[@]}" --data-raw "$PATCH_JSON")
            expect_code "password PUT" '^2[0-9][0-9]$' "$PUT_CODE"
          else
            expect_code "password PATCH" '^2[0-9][0-9]$' "$PATCH_CODE"
          fi

          echo "→ Login"
          rm -f ./.jwt || true
          LOGIN=$(curl -sS -X POST "${AUTH_URL}/token?grant_type=password" -H "apikey: ${ANON_KEY}" -H "Content-Type: application/json" --data-raw "$(printf '{"email":"%s","password":"%s"}' "$TEST_EMAIL" "$TEST_PASSWORD")")
          ACCESS=$(printf '%s' "$LOGIN" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p' | head -n1)
          [[ -n "$ACCESS" ]] || { echo "$LOGIN"; exit 1; }
          printf '%s' "$ACCESS" > ./.jwt
          BASH
          chmod +x auth_hard_fix_and_run.sh

      - name: Add minimal check_jwt.sh and sanity_e2e_strict.sh if missing
        if: env.HAS_SECRETS == 'true'
        run: |
          [[ -f check_jwt.sh ]] || cat > check_jwt.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          set -a; . ./supa_test.env; set +a
          : "${SUPA_REF:?}"; : "${ANON_KEY:?}"
          JWT=$(cat ./.jwt 2>/dev/null || true)
          [[ -n "$JWT" ]] || { echo "no .jwt"; exit 1; }
          URL="https://${SUPA_REF}.supabase.co/auth/v1/user"
          curl -sS -w '\n%{http_code}\n' -H "apikey: ${ANON_KEY}" -H "Authorization: Bearer ${JWT}" "$URL"
          BASH
          chmod +x check_jwt.sh

          [[ -f sanity_e2e_strict.sh ]] || cat > sanity_e2e_strict.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ -f ./supa_test.env ]]; then set -a; . ./supa_test.env; set +a; fi
          : "${SUPA_REF:?}"; : "${ANON_KEY:?}"
          JWT=$(cat ./.jwt 2>/dev/null || true); [[ -n "$JWT" ]] || { echo "Missing .jwt"; exit 1; }
          FN="https://${SUPA_REF}.functions.supabase.co"
          call(){ local url="$1" data="$2"; echo "→ POST $url"; curl -sS -w '\nHTTP %{http_code}\n' -X POST "$url" -H "Content-Type: application/json" -H "apikey: ${ANON_KEY}" -H "Authorization: Bearer ${JWT}" --data-raw "$data"; }
          echo "=== 1) create ==="; C=$(call "${FN}/predict-sessions" '{"category":"pokemon"}'); echo "$C"; echo "$C" | grep -q 'HTTP 200' || exit 1; SID=$(printf '%s' "$C" | sed -n 's/.*"id":\s*\([0-9]\+\).*/\1/p' | head -n1)
          echo; echo "=== 2) complete ==="; P=$(call "${FN}/predict-complete" "{\"session_id\": ${SID}, \"mock_seed\": 0.72}"); echo "$P"; echo "$P" | grep -q 'HTTP 200' || exit 1
          echo; echo "=== 3) label ==="; L=$(call "${FN}/predict-label" "{\"session_id\": ${SID}, \"corrected_title\": \"Pikachu Holo\", \"corrected_condition\": \"Near Mint\", \"corrected_price_eur\": 189}"); echo "$L"; echo "$L" | grep -q 'HTTP 200' || exit 1
          BASH
          chmod +x sanity_e2e_strict.sh

      - name: Run doctor + E2E
        if: env.HAS_SECRETS == 'true'
        run: |
          set -e
          ./auth_hard_fix_and_run.sh
          ./check_jwt.sh
          ./sanity_e2e_strict.sh | tee logs/sanity_${{ github.run_id }}.log

      # Authenticated WRITE flows against the live EC2 backend: creates two
      # throwaway users (service key), then runs the REAL client paths and
      # asserts outcomes — chat (request/accept/inbox/send/read), create-event,
      # follow, watchlist add/remove. Catches FE/BE contract drift, RLS
      # returns-[], RPC param drift, 404/422 before they reach a build.
      # stdlib-only (no pip install); cleans up its own users.
      - name: Authenticated flow E2E (chat / events / follow / watchlist)
        if: env.HAS_SECRETS == 'true'
        env:
          SUPABASE_URL: https://${{ secrets.SUPA_REF }}.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SERVICE_ROLE_KEY }}
          E2E_API_BASE: http://51.21.210.195:8000
        run: python3 server/scripts/e2e_authed_flows.py | tee logs/authed_flows_${{ github.run_id }}.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-e2e-logs
          path: logs/*.log
