# ⛔ NOT WIRED — schedule disabled 2026-09-27. It did nothing, 48 times a day.
#
# Every run logged `Set RAPIDAPI_KEY or EBAY_OAUTH_TOKEN` (neither secret is
# set) and returned success — green every 30 minutes while writing nothing
# (run 36335865383). eBay data does not depend on it: prod's marketplace
# scrape on EC2 writes eBay rows daily (market_hits provider='ebay').
# Re-enable only with a credential AND a reason this legacy 50-item Pokémon
# script is still needed next to the EC2 scrape. See docs/INGEST.md.

name: Ingest eBay
on:
  # schedule: [{ cron: "*/30 * * * *" }]   # disabled 2026-09-27 — see the note at the top
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests
      - env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAPIDAPI_KEY:              ${{ secrets.RAPIDAPI_KEY }}   # or EBAY_OAUTH_TOKEN
          INGEST_CATEGORY:           Pokemon
          EBAY_QUERY:                Pikachu VMAX
          EBAY_LIMIT:                30
          EUR_RATE:                  0.92
        run: python scripts/ingest/ebay_ingest.py
