name: sanity
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://collectors:collectors@localhost:5432/collectors
      DB_DSN: postgresql://collectors:collectors@localhost:5432/collectors
      DB_ENABLED: "true"
      DEV_MODE: "true"
      RATE_LIMIT_ENABLED: "false"
      API_KEY: "dev-key"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y postgresql postgresql-contrib jq
      - name: Start PostgreSQL
        run: sudo systemctl start postgresql
      - name: Setup Postgres
        run: |
          sudo -u postgres psql -c "CREATE USER collectors WITH PASSWORD 'collectors' SUPERUSER;"
          sudo -u postgres createdb -O collectors collectors
      - name: Install Python deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Write .env
        run: |
          cat > .env <<'ENVEOF'
          DATABASE_URL=postgresql://collectors:collectors@localhost:5432/collectors
          DB_DSN=postgresql://collectors:collectors@localhost:5432/collectors
          DB_ENABLED=true
          DEV_MODE=true
          RATE_LIMIT_ENABLED=false
          API_KEY=dev-key
          ENVEOF
      - name: Apply migrations
        run: |
          psql "$DATABASE_URL" -f supabase/migrations/2025-10-01_collectors_core.sql
          psql "$DATABASE_URL" -f supabase/migrations/2025-10-02_alert_rules_fix.sql || true
      - name: Seed demo data
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          INSERT INTO public.market_hits (provider, listing_id, title, price, currency, normalized_key)
          VALUES ('ebay','ci-1','LEGO 10240 X-Wing',255,'EUR','lego|10240')
          ON CONFLICT DO NOTHING;
          SQL
      - name: Start API and run sanity check
        run: |
          cd server
          nohup python -m uvicorn main:app --host 0.0.0.0 --port 8080 > /tmp/api.log 2>&1 &
          API_PID=$!
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz >/dev/null 2>&1 && break
            sleep 1
            if [ "$i" = "30" ]; then
              echo "API startup failed after 30s"
              cat /tmp/api.log | tail -30
              exit 1
            fi
          done
          echo "API up on :8080"
          curl -sf http://localhost:8080/healthz | python -m json.tool
          kill $API_PID 2>/dev/null || true
          echo "Sanity PASS"
