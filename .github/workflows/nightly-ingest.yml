name: Nightly Ingest Pipeline (All Tiers)

on:
  schedule:
    # Run at 03:00 UTC every day (after training pipeline)
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no writes)'
        required: false
        default: 'false'
        type: boolean
      tier:
        description: 'Tier to run (1, 2, 3, or empty for all)'
        required: false
        default: ''
        type: string
      parallel:
        description: 'Number of parallel workers per tier'
        required: false
        default: '4'
        type: string
      cache_images:
        description: 'Cache images to S3'
        required: false
        default: 'false'
        type: boolean

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install httpx boto3 || true

      - name: Run import_all.py (all tiers)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CATALOG_IMAGES_S3_BUCKET: ${{ secrets.CATALOG_IMAGES_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'eu-west-1' }}
          PIPELINE_LOG_LEVEL: INFO
        run: |
          # Build flags
          FLAGS=""

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi

          TIER="${{ github.event.inputs.tier }}"
          if [ -n "$TIER" ]; then
            FLAGS="$FLAGS --tier $TIER"
          fi

          PARALLEL="${{ github.event.inputs.parallel || '4' }}"
          FLAGS="$FLAGS --parallel $PARALLEL"

          if [ "${{ github.event.inputs.cache_images }}" = "true" ]; then
            FLAGS="$FLAGS --cache-images"
          fi

          echo "Running: python -m pipelines.import_all $FLAGS"
          python -m pipelines.import_all $FLAGS

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-logs
          path: |
            data/.import_checkpoint.db
            /tmp/collectai_ingest/
          retention-days: 7
