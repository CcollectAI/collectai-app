name: Nightly Eval + Gate
on:
  schedule: [{ cron: "19 1 * * *" }]
  workflow_dispatch: {}
jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      HAS_SECRETS: ${{ secrets.SUPABASE_URL != '' }}
    steps:
      - name: Check secrets
        if: env.HAS_SECRETS != 'true'
        run: |
          echo "::warning::Skipping — required secrets not configured (SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY)"
          exit 0
      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'
      - uses: actions/setup-python@v5
        if: env.HAS_SECRETS == 'true'
        with: { python-version: '3.12' }
      - name: Install deps
        if: env.HAS_SECRETS == 'true'
        run: pip install requests boto3 httpx numpy scikit-learn
      - name: Run evaluator
        if: env.HAS_SECRETS == 'true'
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EVAL_WINDOW_DAYS:          7
          MAE_DELTA_THRESHOLD:       1.0
        run: python scripts/eval_mae_and_gate.py
