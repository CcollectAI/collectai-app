name: Nightly Train/Eval/Gate
on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt || true
      - name: Train pokemon
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-north-1
          ARTIFACT_BUCKET: collectai-models
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python - <<'PY'
          import trainer
          evt = {
            "model":"price",
            "version":"v0.0.${{ github.run_number }}",
            "dataset_csv":"s3://collectai-datasets/datasets/test.csv",
            "category":"pokemon",
            "meta":{"generated_at":"${{ github.run_id }}"}
          }
          print(trainer.handler(evt, None))
          PY
      - name: Evaluate & Gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GATE_IMPROVE_PCT: "3"
        run: python scripts/eval_mae_and_gate.py pokemon
