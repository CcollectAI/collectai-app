name: Nightly Train/Eval/Gate (All Categories)
on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC
  workflow_dispatch:
    inputs:
      category:
        description: 'Single category to train (leave empty for all)'
        required: false
        default: ''
        type: string
      include_feedback:
        description: 'Include user feedback in training'
        required: false
        default: 'true'
        type: boolean

jobs:
  train-all:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_SECRETS: ${{ secrets.SUPABASE_URL != '' }}

    steps:
      - name: Check secrets
        if: env.HAS_SECRETS != 'true'
        run: |
          # exit 1, not 0. On a SCHEDULED trigger secrets are always
          # available, so a missing one is a misconfiguration — and every
          # real step below is gated on HAS_SECRETS, so exiting 0 reported a
          # job that did nothing as success. That is exactly how
          # nightly-eval.yml ran zero times while showing 8 green checkmarks.
          echo "::error::Required secrets not configured (SUPABASE_URL, SUPABASE_SERVICE_KEY) — this job did NOT run"
          exit 1

      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'

      - uses: actions/setup-python@v5
        if: env.HAS_SECRETS == 'true'
        with: { python-version: "3.12" }

      - name: Install dependencies
        if: env.HAS_SECRETS == 'true'
        working-directory: server
        run: pip install -r requirements.txt || pip install scikit-learn numpy httpx pyyaml asyncpg

      - name: Export user feedback for retraining
        working-directory: server
        if: env.HAS_SECRETS == 'true'
        env:
          DB_DSN: ${{ secrets.DB_DSN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Exporting unprocessed user feedback..."
          python -m pipelines.export_feedback
          echo "Feedback export complete."

      - name: Train all categories
        working-directory: server
        if: env.HAS_SECRETS == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-west-1
          ARTIFACT_BUCKET: collectai-models
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          CATEGORY="${{ github.event.inputs.category }}"
          FEEDBACK_FLAG=""
          if [ "${{ github.event.inputs.include_feedback }}" != "false" ]; then
            FEEDBACK_FLAG="--include-feedback"
          fi

          if [ -n "$CATEGORY" ]; then
            echo "Training single category: $CATEGORY"
            python -m pipelines.train_price \
              --category "$CATEGORY" \
              --register \
              $FEEDBACK_FLAG
          else
            echo "Training ALL 36 categories..."
            python -m pipelines.train_price \
              --all \
              --register \
              $FEEDBACK_FLAG
          fi

      - name: Evaluate & Gate
        working-directory: server
        if: env.HAS_SECRETS == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GATE_IMPROVE_PCT: "3"
        run: |
          # ⛔ THIS STEP HAS NEVER GATED ANYTHING. Corrected message 2026-08-29.
          #
          # It used to test `[ -f scripts/eval_mae_and_gate.py ]` and, on
          # failure, echo "Eval script not found, skipping gate check" and
          # SUCCEED. Three things were wrong with that:
          #
          #   1. The script is not missing. It is at REPO ROOT
          #      (scripts/eval_mae_and_gate.py) while this step sets
          #      `working-directory: server`, so the test was always false.
          #      "Not found" was true of the path, not of the file — which is
          #      why nobody chased it. Confirmed in run 33244113380.
          #   2. Repointing the path is not enough: the command passes a
          #      POSITIONAL argument, and the script takes none. Its
          #      --artifact-prefix is required=True. It would die on argparse.
          #   3. Gating is moot anyway, because nothing survives this job:
          #      train_price writes artifacts/<cat>/<ver>/model.json to the
          #      RUNNER's disk, contains zero S3 code (the ARTIFACT_BUCKET env
          #      above is read by nothing), and --register is a no-op
          #      (MODEL_REGISTRY_WRITE_ENABLED defaults false). The runner is
          #      then destroyed. Serving reads model_registry + S3, so no model
          #      trained here has ever reached production.
          #
          # Left non-failing on purpose: the steps ABOVE do real work
          # (export_feedback writes to the DB), and a job that reddens nightly
          # for a known, documented, undecided reason is one people learn to
          # scroll past. But it must stop implying a gate ran. Wiring the chain
          # (S3 upload + model_registry write + correct invocation) is a
          # decision, not a patch. See docs/INGEST.md.
          echo "::warning::Model gate NOT run — the eval chain is not wired (artifacts never leave this runner). See the comment in this workflow and docs/INGEST.md."
          echo "Trained artifacts are discarded with this runner; no gate was applied and no model was promoted."

      - name: Upload artifacts on failure
        if: failure() && env.HAS_SECRETS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: training-logs
          path: artifacts/
          retention-days: 7
