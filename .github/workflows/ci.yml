name: ci
on:
  push: { branches: ["main"] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_ENABLED: "false"
      DB_DSN: ""
      DEV_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff mypy black
      - name: Format
        run: black --check .
      - name: Lint
        run: ruff check .
      - name: Type
        run: mypy .
      - name: Security scan
        run: |
          pip install bandit pip-audit
          bandit -r app/ -q -ll
          pip-audit --strict
      - name: Test
        run: pytest --cov=app --cov=inference --cov-report=term-missing --cov-fail-under=50 -q

  frontend-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install deps (skip scripts)
        run: npm ci --ignore-scripts
      - name: Audit
        run: npm audit --audit-level=moderate

  # ---------------------------------------------------------------------------
  # Docker image vulnerability scan (Trivy) — main branch only
  # ---------------------------------------------------------------------------
  docker-scan:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t collectai:ci-scan .
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "collectai:ci-scan"
          format: "table"
          exit-code: "1"
          severity: "HIGH,CRITICAL"

