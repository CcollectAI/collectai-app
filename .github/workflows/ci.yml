name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend — lint, type check, security scan, tests
  # ---------------------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_ENABLED: "false"
      DB_DSN: ""
      DEV_MODE: "true"
      RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy black bandit pip-audit
      - name: Format check
        run: black --check server/
        continue-on-error: true
      - name: Lint
        run: ruff check server/
        continue-on-error: true
      - name: Security scan
        run: |
          bandit -r server/app/ -q -ll
          pip-audit --strict
        continue-on-error: true
      - name: Test
        working-directory: server
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_inference.py \
            -x -q \
            --tb=short \
            --junitxml=../test-results/backend.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results/backend.xml

  # ---------------------------------------------------------------------------
  # Frontend — TypeScript check, tests, audit
  # ---------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install deps
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
        continue-on-error: true
      - name: Run tests
        run: npx jest --ci --forceExit --maxWorkers=2
      - name: Audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Docker build + smoke test
  # ---------------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t collectai:${{ github.sha }} .
      - name: Smoke test container
        run: |
          docker run -d --name smoke \
            -p 8080:8080 \
            -e DB_ENABLED=false \
            -e DEV_MODE=true \
            collectai:${{ github.sha }}
          sleep 5
          curl -sf http://localhost:8080/healthz || { docker logs smoke; exit 1; }
          docker stop smoke

  # ---------------------------------------------------------------------------
  # Docker vulnerability scan (Trivy) — main branch only
  # ---------------------------------------------------------------------------
  docker-scan:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [docker]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t collectai:ci-scan .
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "collectai:ci-scan"
          format: "table"
          exit-code: "1"
          severity: "HIGH,CRITICAL"

  # ---------------------------------------------------------------------------
  # Deploy to production (main branch only)
  # ---------------------------------------------------------------------------
  # Prerequisites — configure these GitHub secrets:
  #   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, ECR_REGISTRY
  #   EC2_HOST, EC2_USER, EC2_SSH_KEY
  #
  # To enable: remove the 'if: false' line below.
  # ---------------------------------------------------------------------------
  deploy:
    needs: [backend, frontend, docker]
    if: false && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/collectai:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/collectai:$IMAGE_TAG $ECR_REGISTRY/collectai:latest
          docker push $ECR_REGISTRY/collectai:$IMAGE_TAG
          docker push $ECR_REGISTRY/collectai:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/collectai

            # Pull latest image
            aws ecr get-login-password --region eu-central-1 | \
              docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
            docker compose pull

            # Rolling deploy: stop old, start new
            docker compose up -d --remove-orphans

            # Wait for health check
            echo "Waiting for health check..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8080/healthz > /dev/null 2>&1; then
                echo "Health check passed!"
                exit 0
              fi
              echo "Attempt $i/30 — waiting..."
              sleep 2
            done
            echo "Health check failed after 60s"
            docker compose logs --tail=50 api
            exit 1

      - name: Notify deploy success
        if: success()
        run: echo "::notice::Deployed ${{ github.sha }} to production"

      - name: Notify deploy failure
        if: failure()
        run: echo "::error::Deploy failed for ${{ github.sha }}"
