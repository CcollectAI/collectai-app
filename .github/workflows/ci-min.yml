name: ci-min
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m venv .venv
      - run: .venv/bin/pip install --upgrade pip
      - run: .venv/bin/pip install --constraint constraints.txt -r requirements.txt -r requirements-dev.txt
      - run: .venv/bin/pytest -q --timeout=30 --ignore=server/tests/test_inference.py -x
        env:
          DB_ENABLED: "false"
          DB_DSN: ""
          DEV_MODE: "true"
          CI: "true"
          RATE_LIMIT_ENABLED: "false"
        continue-on-error: true
      # FE column-drift gate — diffs every supabase.from('table').select(...)
      # call in src/ + app/ against scripts/schema.lock.json. Reads the
      # lock file from the repo, so no DB access is needed in CI.
      # If a PR drifts (renames a column, queries a non-existent column),
      # this fails — saving us from "the listing returned [] silently for
      # weeks" bugs. See scripts/audit_fe_supabase_drift.py.
      - name: FE Supabase column-drift check
        run: python3 scripts/audit_fe_supabase_drift.py
      # FE RPC drift gate — diffs every supabase.rpc('rpc_*', { p_x: ... })
      # call against scripts/rpc.lock.json. Catches param renames and
      # missing functions. Allowlist for known-deferred entries lives in
      # scripts/rpc_drift_allowlist.txt.
      - name: FE Supabase rpc-drift check
        run: python3 scripts/audit_fe_rpc_drift.py
      # FE EC2 API drift gate — diffs every (get|post|put|patch|del)('/path')
      # call against scripts/api.lock.json (FastAPI route table snapshot).
      # Same class as the schema/rpc gates: catches a route rename or a
      # caller-side typo before it ships as a silent 404.
      - name: FE EC2 api-drift check
        run: python3 scripts/audit_fe_api_drift.py
      # FE i18n key drift gate — every t('foo.bar') must exist in
      # src/i18n/locales/en.json (the canonical locale). A missing key
      # falls back to the literal key string at runtime — silent UX
      # failure across all six locales.
      - name: FE i18n drift check
        run: python3 scripts/audit_fe_i18n_drift.py
      # Bake worker preflight — same gate that runs as ExecStartPre on
      # collectai-bake.service. Three checks:
      #   1. Every worker in _WORKER_MANIFEST imports cleanly (catches
      #      deploy-side import errors before bake refuses to start).
      #   2. Every manifest entry has a SCHEDULES row with interval > 0
      #      (catches the marketplace_scrape_worker silent-skip bug from
      #      2026-04-17).
      #   3. Every WORKER_OUTPUTS[*].timestamp_column exists in
      #      schema.lock.json (catches the catalog_learning_worker
      #      silent_writer probe bug from 2026-05-01, where the probe
      #      referenced a non-existent column for 10 days).
      - name: Bake worker preflight (imports + SCHEDULES + WORKER_OUTPUTS)
        run: .venv/bin/python scripts/preflight_worker_imports.py
