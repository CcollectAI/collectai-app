name: ci-min
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m venv .venv
      - run: .venv/bin/pip install --upgrade pip
      - run: .venv/bin/pip install --constraint constraints.txt -r requirements.txt -r requirements-dev.txt
      - run: .venv/bin/pytest -q --timeout=30 --ignore=server/tests/test_inference.py -x
        env:
          DB_ENABLED: "false"
          DB_DSN: ""
          DEV_MODE: "true"
          CI: "true"
          RATE_LIMIT_ENABLED: "false"
        continue-on-error: true
      # FE column-drift gate — diffs every supabase.from('table').select(...)
      # call in src/ + app/ against scripts/schema.lock.json. Reads the
      # lock file from the repo, so no DB access is needed in CI.
      # If a PR drifts (renames a column, queries a non-existent column),
      # this fails — saving us from "the listing returned [] silently for
      # weeks" bugs. See scripts/audit_fe_supabase_drift.py.
      - name: FE Supabase column-drift check
        run: python3 scripts/audit_fe_supabase_drift.py
